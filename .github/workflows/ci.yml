name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: aurasync
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Integration tests run against a dedicated database, created by `npm run pretest`.
      DATABASE_URL: postgresql://admin:admin@127.0.0.1:5433/aurasync
      DATABASE_URL_TEST: postgresql://admin:admin@127.0.0.1:5433/aurasync_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+: `node --test` expands the quoted "src/**/*.test.ts" glob itself (nested folders included).
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests (integration, real Postgres)
        run: npm test
      - name: Docker image builds
        run: docker build -t aurasync-api:ci .
